<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- テストのブラウザ用の fontconfig。システムのフォントは読ませず、npm の DejaVu だけを、指定したフォントに無い文字の代わり（fallback）として見せる
     （フォントが1つも無いと Chromium が落ちる）。ゲームの文字は、テスト版に同梱した Web フォントで描かれる。
     日本語は、テスト版の CSS で JetBrains Mono に M PLUS 1 Code を組み合わせている（tools/game-source.mjs の cjkFallback）。
     描き方の設定も固定して、マシンが違っても同じ画素にする。 -->
<fontconfig>
  <dir prefix="relative">../node_modules/dejavu-fonts-ttf/ttf</dir>
  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <cachedir prefix="xdg">ascii-luminescence-test-fonts</cachedir>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
