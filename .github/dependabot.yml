# 依存の更新の PR（Dependabot。GitHub に組み込まれているので、アプリは要らない）。自動マージはしない
version: 2
updates:
  # pnpm も、Dependabot では npm の扱い（package.json と pnpm-lock.yaml を更新する）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    # 公開から1日たった版だけ（pnpm-workspace.yaml の minimumReleaseAge: 1440 と合わせる）
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      # フォントはまとめて更新する（画面写真の基準を作り直すことがある）
      test-fonts:
        patterns: ['@fontsource/*', 'dejavu-fonts-ttf']
    ignore:
      # three.js は r147 に固定（上げると見た目が変わる。別の作業として行う）
      - dependency-name: three
      # Playwright は、クラウド環境の Chromium（/opt/pw-browsers）と版を合わせているので、手で上げる
      - dependency-name: playwright
  # GitHub Actions（コミットのハッシュで固定したまま、ハッシュと版のコメントを更新する）。待つ日数は既定の3日
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ['*']
