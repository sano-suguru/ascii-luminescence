# 確かめるだけの CI（公開は Cloudflare Workers Builds が行う）。
# 速さのために、構文から組み立てまで（static）と、ブラウザのテスト（browser。3台のランナーに3分の1ずつ）を、別のランナーで同時に走らせる。
# 最後の check が2つの結果をまとめる（ブランチの保護で必須にするのは check だけでよい）。
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: 構文・lint・型・整形・単体テスト・使う文字・組み立て
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存を入れる（lockfile どおり。保護の設定は pnpm-workspace.yaml）
        run: pnpm install --frozen-lockfile
      - run: pnpm check
  browser:
    # ブラウザのテストは CPU で描くので、ランナーの当たり外れで2倍ほど変わる。ランナー（4スレッド）は smoke 1つでも CPU が8割埋まり、1台の中で同時に走らせても全体は速くならないので、
    # 台数で分けて待ち時間を縮める（分け方は tests/run.mjs の SEC）
    name: ブラウザのテストと画面写真の比較（${{ matrix.shard }}/${{ matrix.total }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 組を増やす時は、shard に番号を足し、total も同じ数にする
        shard: [1, 2, 3]
        total: [3]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存を入れる（lockfile どおり。保護の設定は pnpm-workspace.yaml）
        run: pnpm install --frozen-lockfile
      # テストは chromium.launch() の既定（headless shell）だけを使うので、Chrome の本体は入れない
      - name: Chromium（headless shell）を入れる
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: ブラウザのテストと画面写真の比較（tests/run.mjs が、この組のテストを同時に3つずつ。画面写真は違えば失敗）
        run: pnpm test --shard ${{ matrix.shard }}/${{ matrix.total }}
      - name: テストの出力（画面写真と tests/out/run/ のログ）を残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-out-${{ matrix.shard }}
          path: tests/out/
          if-no-files-found: ignore
  check:
    needs: [static, browser]
    # 片方が落ちても走らせて、失敗を返す（skipped のままだと、必須のチェックとしては通った扱いになる）。取り消された時だけ走らせない
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 2つのジョブが通ったか
        env:
          STATIC: ${{ needs.static.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "構文から組み立てまで：$STATIC、ブラウザのテスト：$BROWSER"
          test "$STATIC" = success && test "$BROWSER" = success
