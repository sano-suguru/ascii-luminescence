# 確かめるだけの CI（公開は Cloudflare Workers Builds が行う）。PR では、TypeScript に移した関数が移す前と同じ文かも確かめる（tools/same-code.mjs）。
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR では、確かめるのは PR を元の版に重ねた版（merge commit）。1つ目の親が元の版なので、移した関数の比べ合わせに2つ取る
          fetch-depth: 2
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 依存を入れる（lockfile どおり。保護の設定は pnpm-workspace.yaml）
        run: pnpm install --frozen-lockfile
      - name: 構文・lint・整形・単体テスト・使う文字・組み立て
        run: pnpm check
      - name: 移した関数が、移す前と同じ文か（PR の元の版の古い JS と比べる。移していない PR は比べる物が無い）
        if: github.event_name == 'pull_request'
        run: node tools/same-code.mjs --rev HEAD^1 --auto-state src/lib
      - name: Chromium を入れる
        run: pnpm exec playwright install --with-deps chromium
      - name: ブラウザのテスト（tests/run.mjs が7つを同時に3つずつ）
        run: pnpm test
      - name: 画面写真の比較（違えば失敗。違いの画像は下で残す）
        run: pnpm test:visual
      - name: 画面写真を残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: tests/out/
          if-no-files-found: ignore
